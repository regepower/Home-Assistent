name: Release

# Creates a GitHub release (and tag) for the version in manifest.json.
# Start manually: Actions -> Release -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/minjet/manifest.json'))['version'])")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" --target "${GITHUB_SHA}" --title "v${VERSION}" --generate-notes
